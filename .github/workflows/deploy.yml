name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    # 08:15 Asia/Shanghai (GitHub Actions schedules use UTC).
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOOGLE_PUBLISHED_SHEETS_URL: https://docs.google.com/spreadsheets/d/e/2PACX-1vQ8_5GzBV_NO2SBGWIQwBXkO8Jq6uVMCenblygeTLUN20y5FBIm0XQs0YKM7pshaN3A3U2E6s-qxByB/pubhtml
      GOOGLE_SCHEDULE_START_MONTH: "2026-07"
      GOOGLE_PUBLIC_SCHEDULE_MONTH: "2026-09"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Discover and sync published monthly Google Sheet tabs
        run: npm run sync:schedule
      - name: Verify public schedule contains availability only
        run: npm run check:schedule-privacy
      - name: Build
        run: npm run build
      - name: Verify speech detector and worker lifecycle
        run: node --test scripts/check-speak-v1.mjs scripts/check-speak-engine-v1.mjs
      - name: Verify flagship pages and inquiry behavior
        run: |
          node --test scripts/check-inquiry.mjs
          node scripts/check-flagship.mjs / /coaching/ /schools/ /companies/ /contact/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
