  <g class="writing" transform="rotate(-8 68 457)">
    <text x="61" y="451" font-size="19">this is fine.</text>
    <path d="M111 467Q105 499 146 520M137 507 147 520 132 520" class="scribble" stroke-width="2"/>
  </g>
  <path d="M81 716 77 706M85 716 88 707M918 716 923 706M925 717 933 711" class="scribble" stroke-width="2"/>
  <text x="500" y="756" text-anchor="middle" class="writing" font-size="16" letter-spacing="2" fill="#837660">NO DESTINATION. ONLY COW.</text>
</svg>
