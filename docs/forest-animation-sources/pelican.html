<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f5eb">
  <title>The Scenic Route — A Pelican on a Bicycle</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f8f5eb;
      --ink: #254d48;
      --muted: #71817a;
      --accent: #c86545;
      --line: #254d4826;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      padding: 28px clamp(18px, 4vw, 60px);
      background: var(--paper);
      color: var(--ink);
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
    }
    main { width: min(1140px, 100%); margin: auto; }
    .masthead, .brand, .controls, .actions, .speed-control {
      display: flex;
      align-items: center;
    }
    .masthead { justify-content: space-between; gap: 20px; }
    .brand { gap: 10px; font-size: 11px; font-weight: 700; letter-spacing: 2px; }
    .brand svg { width: 34px; height: 34px; }
    .edition { font-size: 10px; letter-spacing: 1.7px; color: var(--muted); }
    .heading { display: flex; justify-content: space-between; align-items: end; gap: 26px; padding: 27px 0 25px; }
    h1 { margin: 0; font: 400 clamp(36px, 5vw, 63px)/1.04 Georgia, "Times New Roman", serif; letter-spacing: -2.3px; }
    h1 em { color: var(--accent); font-weight: 400; }
    .intro { margin: 0 0 2px; max-width: 230px; font-size: 12px; line-height: 1.8; color: var(--muted); }
    .scene { overflow: hidden; position: relative; border-radius: 20px; background: #d9e8df; }
    .art { display: block; width: 100%; height: auto; }
    .scene-label { position: absolute; z-index: 1; top: 24px; left: 28px; font-size: 9px; letter-spacing: 2.2px; color: #497469; pointer-events: none; }
    .scene-label::before { content: ""; display: inline-block; width: 20px; height: 1px; margin-right: 9px; background: currentColor; vertical-align: middle; }
    .controls { justify-content: space-between; gap: 24px; padding: 18px 0; border-bottom: 1px solid var(--line); }
    .caption { margin: 0; font-size: 11px; color: var(--muted); }
    .caption strong { color: var(--ink); font-weight: 600; }
    .caption::before { content: ""; display: inline-block; width: 6px; height: 6px; background: var(--accent); border-radius: 50%; margin-right: 9px; vertical-align: 1px; }
    .actions { gap: 22px; }
    .speed-control { gap: 10px; font-size: 11px; }
    .speed-control label { color: var(--muted); }
    input[type="range"] { width: 80px; accent-color: var(--ink); cursor: pointer; }
    output { min-width: 26px; font-variant-numeric: tabular-nums; }
    button { display: flex; align-items: center; justify-content: center; gap: 8px; min-width: 107px; min-height: 40px; padding: 10px 16px; border: 1px solid #254d4850; border-radius: 24px; background: transparent; color: var(--ink); font: 600 11px "Segoe UI", sans-serif; cursor: pointer; }
    button:hover { background: #e7ece1; }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    button svg { width: 12px; height: 12px; }
    .footer { display: flex; justify-content: space-between; gap: 12px; padding-top: 12px; font-size: 9px; color: #7c8b81; letter-spacing: 1.15px; text-transform: uppercase; }
    @media (min-width: 1600px) { body { display: grid; place-items: center; } }
    @media (max-width: 680px) {
      body { padding: 20px 16px; }
      .edition { display: none; }
      .heading { display: block; padding: 26px 0 20px; }
      h1 { letter-spacing: -1.6px; }
      .intro { max-width: none; margin-top: 14px; font-size: 11px; }
      .scene { border-radius: 14px; }
      .scene-label { top: 14px; left: 16px; font-size: 7px; letter-spacing: 1px; }
      .art { width: 150%; max-width: none; margin-left: -25%; }
      .controls { flex-wrap: wrap; gap: 16px; }
      .actions { width: 100%; justify-content: space-between; }
      .caption { font-size: 10px; }
      .footer { font-size: 8px; letter-spacing: .6px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="masthead">
      <div class="brand">
        <svg viewBox="0 0 40 40" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="20" cy="20" r="18" stroke-opacity=".25"/>
          <path d="M9 25c7 6 17 1 14-6l-2-5c-1-5 5-6 6-2l8 3-9 1M10 22l-3-4 8 2m7 8-1 4m-5-4-1 4"/>
          <circle cx="24" cy="12" r=".8" fill="currentColor" stroke="none"/>

    </header>

            <path d="M399 469 544 457a25 25 0 0 1 0 48L399 498a15 15 0 0 1 0-29Z" stroke="#6a826f" stroke-width="3"/>
            <path d="M400 484 485 365 548 481 400 484M485 365H696L548 481M681 325 753 484" stroke="#ba654c" stroke-width="11"/>
            <path d="M400 481 485 362 548 478M488 362H694M682 326 750 480" stroke="#df8c67" stroke-width="4"/>
            <path d="m485 365-8-24" stroke="#567363" stroke-width="7"/>

            <path d="M451 336h43" stroke="#5a7460" stroke-width="2"/>
            <path d="m681 325-6-21q-2-11 11-11h34q13 0 13 11" stroke="#557766" stroke-width="7"/>

          </g>

    <div class="controls">

  <script>
    (() => {
      'use strict';
      const byId = (id) => document.getElementById(id);
      const elements = Object.fromEntries([
        'rear-spokes', 'front-spokes', 'clouds', 'islands', 'grasses',
        'water', 'road-dashes', 'bicycle', 'pelican', 'shadow', 'gulls',
        'breeze', 'scarf-tail', 'scarf-stitch', 'wing', 'wing-outline', 'eye',
        'near-leg', 'near-leg-outline', 'far-leg', 'far-leg-outline',
        'near-crank', 'far-crank', 'near-foot', 'far-foot', 'near-pedal', 'far-pedal'
      ].map((id) => [id, byId(id)]));
      const toggle = byId('toggle');
      const speed = byId('speed');
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
      const TAU = Math.PI * 2;
      const crank = { x: 548, y: 481, radius: 30 };
      let paused = reducedMotion.matches;
      let pace = 1;
      let time = 0;
      let previous = null;
      let frameId = null;

      const set = (id, attribute, value) => elements[id].setAttribute(attribute, value);
      const translate = (id, x, y = 0) => set(id, 'transform', `translate(${x.toFixed(3)} ${y.toFixed(3)})`);

      // Two-segment inverse kinematics keeps each leg connected to its pedal.
      function leg(side, hipX, hipY, angle) {
        const x = crank.x + Math.cos(angle) * crank.radius;
        const y = crank.y + Math.sin(angle) * crank.radius;
        const ankleY = y - 6;
        const dx = x - hipX;
        const dy = ankleY - hipY;
        const distance = Math.hypot(dx, dy);
        const upper = 86;
        const lower = 94;
        const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
        const height = Math.sqrt(Math.max(0, upper * upper - along * along));
        const kneeX = hipX + along * dx / distance + height * dy / distance;
        const kneeY = hipY + along * dy / distance - height * dx / distance;
        const path = `M${hipX} ${hipY}L${kneeX} ${kneeY} ${x} ${ankleY}`;
        set(`${side}-leg`, 'd', path);
        set(`${side}-leg-outline`, 'd', path);
        set(`${side}-crank`, 'd', `M${crank.x} ${crank.y}L${x} ${y}`);
        set(`${side}-pedal`, 'd', `M${x - 12} ${y + 7}h36`);
        set(`${side}-foot`, 'd', `M${x - 5} ${y - 8}L${x + 4} ${y - 7} ${x + 13} ${y - 1} ${x + 26} ${y + 3} ${x + 15} ${y + 6} ${x + 7} ${y + 3} ${x - 4} ${y + 6} ${x - 12} ${y + 3}Z`);
      }

      function draw() {
        const cycle = time * TAU / 1.65;
        const bodyBob = Math.sin(cycle * 2) * 1.5;
        const roadBob = Math.sin(cycle * 2 + .8) * .6;
        const flutter = Math.sin(time * 11) * 5;
        // A 2:1 wheel/crank ratio; road travel matches the wheel circumference.
        const distance = time * (TAU * 89) * 2 / 1.65;
        const wheelAngle = cycle * 2 * 180 / Math.PI;
        set('rear-spokes', 'transform', `rotate(${wheelAngle % 360})`);
        set('front-spokes', 'transform', `rotate(${wheelAngle % 360})`);
        translate('clouds', -(time * 7 % 1200));
        translate('islands', -(time * 17 % 1200));
        translate('grasses', -(distance % 1200));
        set('water', 'patternTransform', `translate(${-time * 31 % 440} 0)`);
        set('road-dashes', 'patternTransform', `translate(${-distance % 240} 0)`);
        translate('bicycle', 0, roadBob);
        translate('pelican', 0, bodyBob);
        translate('gulls', 0, Math.sin(time * 1.3) * 3);
        set('shadow', 'rx', 281 + bodyBob * 1.8);
        set('breeze', 'opacity', .35 + .2 * (Math.sin(time * 3) + 1) / 2);
        set('scarf-tail', 'd', `M580 247C552 ${237 + flutter} 529 ${248 - flutter} 502 ${230 + flutter}L481 ${235 + flutter} 492 ${247 + flutter} 474 ${257 + flutter}C517 ${252 - flutter} 546 ${270 + flutter} 582 260Z`);
        set('scarf-stitch', 'd', `M488 ${248 + flutter}Q530 ${240 - flutter} 569 254`);
        const wing = `M515 294Q571 ${334 + bodyBob} 618 ${316 - bodyBob}L714 ${297 - bodyBob}`;
        set('wing', 'd', wing);
        set('wing-outline', 'd', wing);
        leg('far', 499, 351 + bodyBob, cycle + Math.PI + .45);
        leg('near', 513, 350 + bodyBob, cycle + .45);
        // A brief blink every few seconds, driven by the same pausable clock.
        const blinkAt = time % 5.7;
        const openness = blinkAt > 5.46 ? Math.max(.08, Math.abs(blinkAt - 5.58) / .12) : 1;
        set('eye', 'transform', `translate(0 ${175 * (1 - openness)}) scale(1 ${openness})`);
      }

      function frame(now) {
        frameId = null;
        if (paused || document.hidden) { previous = null; return; }
        if (previous !== null) time += Math.min((now - previous) / 1000, .05) * pace;
        previous = now;
        draw();
        frameId = requestAnimationFrame(frame);
      }

      function schedule() {
        if (!paused && !document.hidden && frameId === null) frameId = requestAnimationFrame(frame);
      }

      function syncPlayback() {
        previous = null;
        if (frameId !== null) cancelAnimationFrame(frameId);
        frameId = null;
        byId('toggle-label').textContent = paused ? 'Play ride' : 'Pause ride';
        toggle.setAttribute('aria-label', paused ? 'Play animation' : 'Pause animation');
        byId('toggle-icon').setAttribute('d', paused ? 'M3 1.5 10 6 3 10.5Z' : 'M3 2v8M9 2v8');
        byId('toggle-icon').setAttribute('fill', paused ? 'currentColor' : 'none');
        schedule();
      }

      toggle.addEventListener('click', () => { paused = !paused; syncPlayback(); });
      speed.addEventListener('input', () => {
        pace = Number(speed.value);
        byId('pace').textContent = `${pace}×`;
        speed.setAttribute('aria-valuetext', `${pace} times normal pace`);
      });
      reducedMotion.addEventListener('change', (event) => { paused = event.matches; syncPlayback(); });
      document.addEventListener('visibilitychange', () => {
        previous = null;
        if (document.hidden && frameId !== null) { cancelAnimationFrame(frameId); frameId = null; }
        schedule();
      });
      draw();
      syncPlayback();
    })();
  </script>
</body>
</html>
