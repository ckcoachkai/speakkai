<div id="imagination-sprint">
  <header><h2>Problem-solving sprint</h2><p class="text-muted">500 problem prompts · 1 minute</p></header>
  <div class="viz-row"><span class="tabular-nums" id="clock">60 seconds</span><span id="score">0 answered</span><span class="text-muted" id="skips">0 skipped</span></div>
  <div class="progress" role="progressbar" aria-label="Time remaining" aria-valuemin="0" aria-valuemax="60" aria-valuenow="60"><div class="progress-bar" style="width:100%"></div></div>
  <section class="question-area" aria-live="polite" aria-atomic="true">
    <p class="text-small text-muted" id="number">500 PROBLEMS · ONE MINUTE</p>
    <h2 id="prompt">How many problems can you solve in 60 seconds?</h2>
    <p id="cue">Say what you would do and why.</p>
  </section>
  <div class="viz-controls">
    <button class="btn btn-primary" id="start" type="button">Start 60-second round</button>
    <button class="btn btn-primary" id="answer" type="button" hidden>Answered +1</button>
    <button class="btn" id="skip" type="button" hidden>Skip</button>
    <button class="btn btn-ghost" id="reset" type="button">Reset</button>
  </div>
  <div id="results" hidden><details><summary>Review this round</summary><ol id="review"></ol></details></div>
</div>
<style>
#imagination-sprint [hidden] {display:none!important}
#imagination-sprint header {padding-right:90px}

#imagination-sprint .progress {margin-top:16px}
#imagination-sprint #results {margin-top:20px}
#imagination-sprint li {margin:10px 0}
</style>

let state = {phase:'ready',order:[],history:[],deadline:0};
let ticker;
function save() {
 if(window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{game:'Problem-solving sprint',answered:state.history.filter(h=>h.ok).length,skipped:state.history.filter(h=>!h.ok).length,phase:state.phase},privateContent:{version:2,...state}}).catch(()=>{});
}
function remaining(){return state.phase==='ready'?60:Math.max(0,Math.ceil((state.deadline-Date.now())/1000));}
function render(){
 const active=state.phase==='playing';
 const done=state.phase==='done';
 const count=state.history.filter(h=>h.ok).length;
 const left=remaining();
 el('clock').textContent=left+' seconds';
 el('score').textContent=count+' answered';
 el('skips').textContent=(state.history.length-count)+' skipped';
 root.querySelector('.progress').setAttribute('aria-valuenow',left);
 root.querySelector('.progress-bar').style.width=(left/60*100)+'%';
 el('start').hidden=active;el('answer').hidden=!active;el('skip').hidden=!active;
 el('answer').disabled=!active;el('skip').disabled=!active;
 el('results').hidden=!done;
 if(active){
  const idx=state.order[state.history.length];
  el('number').textContent='PROBLEM '+(1+idx)+' · '+(state.history.length+1)+' OF 500';
  el('prompt').textContent=prompts[idx];
  el('cue').textContent='What would you do? “I would… because…”';
 }else if(state.phase==='ready'){
  el('number').textContent='500 PROBLEMS · ONE MINUTE';
  el('prompt').textContent='How many problems can you solve in 60 seconds?';
  el('cue').textContent='Say what you would do and why.';
  el('start').textContent='Start 60-second round';
 }else if(done){
  el('number').textContent=state.history.length===500?'ALL 500 PROMPTS COMPLETED':'TIME’S UP';
  el('prompt').textContent=count+' '+(count===1?'problem':'problems')+' answered!';
  el('cue').textContent='Ready for another problem-solving sprint?';
  el('start').textContent='Play again';
  el('review').replaceChildren();
  state.history.forEach(h=>{const li=document.createElement('li');li.textContent=(h.ok?'Answered':'Skipped')+' · '+(1+h.idx)+'. '+prompts[h.idx];el('review').append(li);});
  if(state.history.length<500){const li=document.createElement('li');li.textContent='Unfinished · '+prompts[state.order[state.history.length]];el('review').append(li);}
 }
}
function finish(){state.phase='done';clearInterval(ticker);render();save();el('start').focus();}
function tick(){
 if(state.phase!=='playing')return;
 const left=remaining();
 if(left===0){finish();return;}
 el('clock').textContent=left+' seconds';
 root.querySelector('.progress').setAttribute('aria-valuenow',left);
 root.querySelector('.progress-bar').style.width=(left/60*100)+'%';
}
function mark(ok){
 if(state.phase!=='playing')return;
 if(Date.now()>=state.deadline){finish();return;}
 state.history.push({idx:state.order[state.history.length],ok});
 if(state.history.length===500)finish();else{render();save();}
}
el('start').addEventListener('click',()=>{
 const order=Array.from({length:prompts.length},(_,i)=>i);
 for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
 state={phase:'playing',order,history:[],deadline:Date.now()+60000};
 clearInterval(ticker);ticker=setInterval(tick,100);render();save();el('answer').focus();
});
el('answer').addEventListener('click',()=>mark(true));
el('skip').addEventListener('click',()=>mark(false));
el('reset').addEventListener('click',()=>{clearInterval(ticker);state={phase:'ready',order:[],history:[],deadline:0};el('review').replaceChildren();render();save();el('start').focus();});
function restore(snapshot){
 const s=snapshot?.privateContent;
 if(s?.version===2&&s.phase==='ready'){clearInterval(ticker);state={phase:'ready',order:[],history:[],deadline:0};render();return;}
 if(!s||s.version!==2||!['playing','done'].includes(s.phase)||!Array.isArray(s.order)||s.order.length!==500||new Set(s.order).size!==500||!s.order.every(n=>Number.isInteger(n)&&n>=0&&n<500)||!Array.isArray(s.history)||s.history.length>500||!s.history.every((h,i)=>h.idx===s.order[i]&&typeof h.ok==='boolean')||!Number.isFinite(s.deadline))return;
 state={phase:s.phase,order:s.order.slice(),history:s.history.slice(),deadline:s.deadline};
 clearInterval(ticker);
 if(state.phase==='playing'&&(remaining()===0||state.history.length===500))state.phase='done';
 render();if(state.phase==='playing')ticker=setInterval(tick,100);
}
render();
restore(window.openai?.widgetState);
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)restore(e.detail.globals.widgetState);});
})();
